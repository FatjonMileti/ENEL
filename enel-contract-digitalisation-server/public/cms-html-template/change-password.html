<!DOCTYPE html>
<html>

<head>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, width=device-width">
    <meta name="robots" content="index, follow" />
    <meta name="language" content="ro" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>PPC | Change password</title>

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i,800,800i" rel="stylesheet">
    <link type="text/css" href="css/icons.css" rel="stylesheet" />
    <link type="text/css" href="css/global.css" rel="stylesheet" />

    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.0/jquery.min.js"></script>
    <script src="js/jquery-1.11.2.min.js"></script>
    <script src="js/main.js"></script>

</head>

<body>

    <div class="wrapper login-page view-login-form">

        <div class="table">
            <div class="table-cell">
                <form class="login-form">

                    <!-- <div class="error-msg">Error msg</div> -->
                    <fieldset>
                        <div class="box-logo"><img src="img/ppc_logo_white.png" alt="" /></div>
                        <h3>Modifica Parola</h3>
                        <input type="text" name="" placeholder="Marca / Username" />
                        <input class="" type="password" name="" placeholder="Parola curenta" />
                        <input class="" type="password" name="" placeholder="Parola noua" />
                        <input class="mar2b" type="password" name="" placeholder="Reintroducere parola noua" />
                        <div class="capcha-code-box"></div>
                        <span class="mod-info"><i class="icon-wlc-alert-3"></i>Atentie, dupa scimbarea parolei vei fi automat deconectat din toate aplicatiile</span>
                        <button class="button blue">Schimba Parola</button>
                    </fieldset>

                </form>
                <div class="copy"><img src="img/fullscreendigital-logo.svg" alt="" /><p>Designed &amp; Engineered by Fullscreen Digital</p></div>
            </div>
        </div>

    </div><!-- end wrapper -->

    <div class="portrait">
        <div class="table">
            <div class="table-cell">
                <i class="icon-screen-rotation"></i>
                <p>Please turn your device<br />to landscape</p>
            </div>
        </div>
    </div><!-- end portrait -->

</body>
</html>
