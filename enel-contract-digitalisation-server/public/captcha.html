<html>

<head>
  <title>PPC - Digitalization Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sixing: border-box;
    }

    html,
    body {
      font-family: 'Helvetica Neue', 'Helevetica', 'Arial', 'sans-serif';
      font-weight: 400;
      font-size: 16px;
      color: #333;
    }

    main {
      margin-top: 100px;
      padding: 20px;
    }

    img.logo {
      display: inline-block;
      width: 100px;
    }

    h1 {
      font-weight: 100;
      font-size: 8em;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 2em;
      font-weight: 100;
    }

    .center-text {
      text-align: center;
    }

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
    }

    footer p {
      font-weight: 300;
      font-size: 20px;
    }
  </style>
  <script src="https://www.google.com/recaptcha/api.js"></script>
</head>

<body>
  <main class="container">
    <h1 id="code" class="center-text">PPC</h1>
    <h2 id="message" class="center-text">Digitalization Server</h2>
      <form>
        <p>Response: <input type="text" id="txtResponse"></input></p>
        <div class="g-recaptcha" data-sitekey="6LegCmwUAAAAALCwdzOmj7KMXrSlgJQE3HVmQ6tb"></div>
        <input type="submit" value="Get Code">
      </form>
    <footer>
    </footer>
  </main>
  <script>
    let $ = document.querySelectorAll.bind(document);
    $('form')[0].onsubmit = (e) => {
      e.preventDefault();
      let response = grecaptcha.getResponse();
      $('#txtResponse')[0].value = response || 'Not validated !';
      $('#txtResponse')[0].focus();
    }
  </script>
</body>

</html>
